[workspace]
resolver = "3"
members = ["app", "bootloader", "crates/*", "tools/*"]
default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"


[workspace.dependencies]

# Embedded
embassy-stm32 = { version = "0.6.0", features = [ "time", "time-driver-tim5", "stm32h723vg", "unstable-pac", "exti"]  }
embassy-sync = { version = "0.8.0" }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1", features = ["defmt-timestamp-uptime", "tick-hz-1_000_000"] }
embassy-futures = { version = "0.1.2" }

embassy-boot-stm32 = { version = "0.8.0" }

cortex-m = { version = "0.7.9", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"

defmt = "1.1"

south-common = { git = "https://github.com/S2outh/south-common.git", features = ["serde"] }

# Common
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
minicbor-serde = { version = "0.7.1" }

nalgebra = { version = "0.35.0", default-features = false }

# Tools
tokio = { version = "1.53.2", features = [ "rt-multi-thread", "macros" ] }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"

[patch.crates-io]
embassy-stm32 = { git = "https://github.com/Eleocraft/embassy.git" }
embassy-sync = { git = "https://github.com/Eleocraft/embassy.git" }
embassy-executor = { git = "https://github.com/Eleocraft/embassy.git" }
embassy-time = { git = "https://github.com/Eleocraft/embassy.git" }
embassy-futures = { git = "https://github.com/Eleocraft/embassy.git" }
embassy-embedded-hal = { git = "https://github.com/Eleocraft/embassy.git" }

embassy-boot = { git = "https://github.com/Eleocraft/embassy.git" }
embassy-boot-stm32 = { git = "https://github.com/Eleocraft/embassy.git" }

embassy-net = { git = "https://github.com/Eleocraft/embassy.git" }

[patch."https://github.com/embassy-rs/embassy"]
embassy-crypto = { git = "https://github.com/Eleocraft/embassy.git" }

[profile.dev]
opt-level = 3
debug = 2
debug-assertions = false
lto = true
codegen-units = 16

[profile.release]
opt-level = "s"
lto = true
debug = 2
