[workspace]
resolver = "3"
members = ["app", "bootloader", "crates/*", "tools/*"]
default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"


[workspace.dependencies]

# Embedded
embassy-stm32 = { git = "https://github.com/Eleocraft/embassy.git", branch = "embassy_boot_crypto", features = [ "time", "time-driver-any", "stm32h723vg", "unstable-pac", "exti"]  }
embassy-sync = { git = "https://github.com/Eleocraft/embassy.git", branch = "embassy_boot_crypto" }
embassy-executor = { git = "https://github.com/Eleocraft/embassy.git", branch = "embassy_boot_crypto", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { git = "https://github.com/Eleocraft/embassy.git", branch = "embassy_boot_crypto", features = ["defmt-timestamp-uptime", "tick-hz-1_000_000"] }
embassy-futures = { git = "https://github.com/Eleocraft/embassy.git", branch = "embassy_boot_crypto" }

embassy-boot-stm32 = { git = "https://github.com/Eleocraft/embassy.git", branch = "embassy_boot_crypto" }

cortex-m = { version = "0.7.9", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"

defmt = "1.1"

south-common = { git = "https://github.com/S2outh/south-common.git", features = ["serde"] }

# Common
embassy-crypto = { git = "https://github.com/Eleocraft/embassy.git", branch = "embassy_boot_crypto" }
embassy-crypto-rand = { git = "https://github.com/Eleocraft/embassy.git", branch = "embassy_boot_crypto" }
embassy-crypto-rustcrypto = { git = "https://github.com/Eleocraft/embassy.git", branch = "embassy_boot_crypto", features = ["embassy-crypto-sha512", "embassy-crypto-ed25519"] }

serde = { version = "1.0.229", default-features = false, features = ["derive"] }
minicbor-serde = { version = "0.7.1" }

nalgebra = { version = "0.35.0", default-features = false }

# Tools
tokio = { version = "1.53.2", features = [ "rt-multi-thread", "macros" ] }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"

[profile.dev]
opt-level = 3
debug = 2
debug-assertions = false
lto = true
codegen-units = 16

[profile.release]
lto = true
debug = 2
