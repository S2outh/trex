[package]
name = "trex"
version.workspace = true
edition.workspace = true

[dependencies]
trex-firmware-transport.path = "../crates/trex-firmware-transport"

embassy-stm32.workspace = true
embassy-sync.workspace = true
embassy-executor.workspace = true
embassy-time.workspace = true
embassy-futures.workspace = true

cortex-m.workspace = true
cortex-m-rt.workspace = true

embassy-boot-stm32 = { workspace = true, features = ["defmt"] }

embassy-crypto.workspace = true
embassy-crypto-rustcrypto.workspace = true

defmt.workspace = true

serde.workspace = true
minicbor-serde.workspace = true
minicbor = "2.3.0"

south-common.workspace = true

nalgebra.workspace = true

static_cell = { version = "2.1.1", features = ["nightly"] }

embedded-storage-async = "0.4.2"

embassy-embedded-hal = { git = "https://github.com/Eleocraft/embassy.git", branch = "embassy_boot_crypto" }

embassy-net = { git = "https://github.com/Eleocraft/embassy.git", branch = "embassy_boot_crypto", features = ["tcp", "tcp-listener", "defmt", "dns", "medium-ethernet", "dhcpv4", "ipv4", "ipv6" ] }

embassy-nats = { git = "https://github.com/S2outh/embassy-nats.git", branch = "unstable-embassy", features = ["defmt"] }

portable-atomic = { version = "1.15.0", features = ["float"] }
heapless = "0.9.3"
critical-section = "1.2.0"
libm = "0.2.16"
