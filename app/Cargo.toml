[package]
name = "trex"
version.workspace = true
edition.workspace = true

[dependencies]
trex-firmware-transport.path = "../crates/trex-firmware-transport"

embassy-stm32.workspace = true
embassy-sync.workspace = true
embassy-executor.workspace = true
embassy-time.workspace = true
embassy-futures.workspace = true

cortex-m.workspace = true
cortex-m-rt.workspace = true

embassy-boot-stm32 = { workspace = true, features = ["defmt"] }

defmt.workspace = true
blake3.workspace = true

serde.workspace = true
minicbor-serde.workspace = true

static_cell = { version = "2.1.1", features = ["nightly"] }

embedded-storage-async = "0.4.1"
embassy-embedded-hal = "0.6.0"

embassy-net = { version = "0.9.1", features = ["tcp", "udp", "dhcpv4", "defmt", "medium-ethernet", "proto-ipv6", "dns"] }

embassy-nats = { git = "https://github.com/S2outh/embassy-nats.git" }
portable-atomic = "1.15.0"
heapless = "0.9.3"
critical-section = "1.2.0"
