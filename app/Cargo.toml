[package]
name = "trex"
version.workspace = true
edition.workspace = true

[dependencies]
trex-firmware-transport.path = "../crates/trex-firmware-transport"

embassy-stm32.workspace = true
embassy-sync.workspace = true
embassy-executor.workspace = true
embassy-time.workspace = true
embassy-futures.workspace = true

cortex-m.workspace = true
cortex-m-rt.workspace = true

embassy-boot-stm32 = { workspace = true, features = ["defmt"] }
embassy-boot = { version = "0.7.0" }

#embassy-crypto = { version = "0.1.0" }
embassy-crypto = { git = "https://github.com/embassy-rs/embassy" }
mcu-crypto-asm = { git = "https://github.com/kokroo/mcu-crypto-asm.git", features = ["embassy-crypto-sha512", "embassy-crypto-ed25519"] }

defmt.workspace = true

serde.workspace = true
minicbor-serde.workspace = true
minicbor = "2.3.0"

south-common.workspace = true

nalgebra.workspace = true

static_cell = { version = "2.1.1", features = ["nightly"] }

embedded-storage-async = "0.4.2"
embassy-embedded-hal = "0.6.0"

embassy-net = { version = "0.9.1", features = ["tcp", "udp", "dhcpv4", "defmt", "medium-ethernet", "dns", "tcp-listener" ] }

embedded-nats = { git = "https://github.com/S2outh/embedded-nats.git", branch = "unstable-embassy", features = ["defmt"] }

nmea = { version = "0.8.0", default-features = false, features = ["GGA", "defmt"] }

portable-atomic = { version = "1.15.0", features = ["float"] }
heapless = "0.9.3"
critical-section = "1.2.0"
libm = "0.2.16"
thiserror = { version = "2.0.21", default-features = false }
panic-halt = "1.0.0"
